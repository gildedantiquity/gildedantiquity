<header class="site-header">
  <nav class="nav" aria-label="Utama">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">AGEN<span>SI</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
      Menu
    </button>
    <ul class="nav-links" id="nav-menu">
      {{ $current := . }}
      {{ $posts := .Site.GetPage "/posts" }}
      {{ range .Site.Menus.main }}
        <li>
          <a
            href="{{ .URL }}"
            {{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}aria-current="page"{{ end }}
            {{ if and (eq .Name "Blog") (eq $current.Section "posts") }}aria-current="page"{{ end }}
            >{{ .Name }}</a
          >
        </li>
      {{ end }}
      <li>
        <a class="nav-cta" href="{{ with $posts }}{{ .RelPermalink }}{{ else }}{{ .Site.Home.RelPermalink }}{{ end }}"
          >Baca blog</a
        >
      </li>
    </ul>
  </nav>
</header>
